name: M4 Nightly Market Pack Matrix

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

# Raw archives and derived series remain in the runner's temporary directory.
# A successful final step is the success-only DET-1/DET-5/DATA-2 receipt.
jobs:
  pack-matrix:
    name: rebuild, validate, record, and replay 13 packs
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Verify and install the exact dependency lock
        run: |
          uv lock --check
          uv sync --locked --group dev
      - name: Recheck tracked-tree distribution policy
        run: >-
          uv run --locked --no-sync
          python -m data.distribution_guard --repo-root .
      - name: Offline catalog preflight
        run: >-
          uv run --locked --no-sync
          python -m data.nightly
          --plan-only
          --expected-pack-count 13
      - name: Run the full deterministic adversarial fuzz gates
        env:
          TRADEVOLVE_FUZZ_EPISODES: "10000"
        run: |
          uv run --locked --no-sync pytest -q \
            core/tests/test_engine_adversarial.py::test_deterministic_generated_action_sequences_preserve_ledger_invariants
          uv run --locked --no-sync pytest -q \
            core/tests/test_action.py::test_ten_thousand_malformed_bodies_never_raise
      - name: Execute complete deterministic matrix
        run: |
          set -euo pipefail
          matrix_root="${RUNNER_TEMP}/tradeevolve-nightly"
          created_at_ms="$(($(date -u +%s) * 1000))"
          uv run --locked --no-sync python -m data.nightly \
            --run-matrix \
            --repo-root . \
            --work-root "${matrix_root}/work" \
            --raw-root "${matrix_root}/raw" \
            --created-at-ms "${created_at_ms}" \
            --expected-pack-count 13
